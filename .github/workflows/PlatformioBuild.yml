name: PlatformIOBuild

env:
  PROJECT_DIR: examples/Test/build_test

on:
  push:
    paths:
    - '**.ino'
    - '**.cpp'
    - '**.hpp'
    - '**.h'
    - '**.c'
    - '**PlatformioBuild.yml'
    - '**/platformio.ini'
    - '**/platformio_esp32.ini'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.board }}@${{ matrix.platform-version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:

        board:
          - esp32
          - esp32-s2
          - esp32-s3
          - esp32-c3
          - esp32-p4
          - m5stick-c
          - m5stack-core-esp32
          - m5stack-core2
          - m5stack-cores3

        platform-version:
          - 2.0.15
          - 2.0.16
          - 2.0.17
          - default

        exclude:
          - { board: esp32-c3, platform-version: 1.0.6 }
          - { board: esp32-s3, platform-version: 1.0.6 }
          - { board: esp32-s2, platform-version: 1.0.6 }
          - { board: esp32-p4, platform-version: 1.0.6 }
          - { board: m5stack-cores3, platform-version: 1.0.6 }
          - { board: esp32-p4, platform-version: 2.0.15 }
          - { board: esp32-p4, platform-version: 2.0.16 }
          - { board: esp32-p4, platform-version: 2.0.17 }

      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run PlatformIO
        run: |
          cd ${{ env.PROJECT_DIR }}
          export pio_ver=${{ matrix.platform-version }}
          export pio_env="${pio_ver//./_}"
          
          # Map GitHub Actions board names to PlatformIO environment names
          if [[ "${{ matrix.board }}" == "esp32" ]]; then
            env_prefix="esp32"
          elif [[ "${{ matrix.board }}" == "esp32-s2" ]]; then
            env_prefix="esp32s2"
          elif [[ "${{ matrix.board }}" == "esp32-s3" ]]; then
            env_prefix="esp32s3"
          elif [[ "${{ matrix.board }}" == "esp32-c3" ]]; then
            env_prefix="esp32c3"
          elif [[ "${{ matrix.board }}" == "esp32-p4" ]]; then
            env_prefix="esp32p4"
          elif [[ "${{ matrix.board }}" == "m5stick-c" ]]; then
            env_prefix="m5stickc"
          elif [[ "${{ matrix.board }}" == "m5stack-core-esp32" ]]; then
            env_prefix="m5stack"
          elif [[ "${{ matrix.board }}" == "m5stack-core2" ]]; then
            env_prefix="m5core2"
          elif [[ "${{ matrix.board }}" == "m5stack-cores3" ]]; then
            env_prefix="m5cores3"
          else
            env_prefix="${{ matrix.board }}"
          fi
          
          pio pkg install -e ${env_prefix}-$pio_env --no-save --library file://$(realpath ../../../)
          pio run -e ${env_prefix}-$pio_env
