[coding_standards]
build_flags       =
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-sign-compare
    -Wunreachable-code
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat
    -Wnonnull

[platform_default]
tasmota_2xx       = https://github.com/tasmota/platform-espressif32/releases/download/2023.11.01/platform-espressif32.zip

[esp32_2_0_15]
platform          = ${platform_default.tasmota_2xx}
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.15/esp32-2.0.15.zip
build_flags       = ${coding_standards.build_flags}

[esp32_2_0_16]
platform          = ${platform_default.tasmota_2xx}
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.16/esp32-2.0.16.zip
build_flags       = ${coding_standards.build_flags}

[esp32_2_0_17]
platform          = ${platform_default.tasmota_2xx}
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
build_flags       = ${coding_standards.build_flags}

[esp32_default]
platform          = ${platform_default.tasmota_2xx}
build_flags       = ${coding_standards.build_flags}

[esp32]
board             = esp32dev
[M5StickC]
board             = m5stick-c
[M5Stack]
board             = m5stack-core-esp32
[M5Core2]
board             = m5stack-core2
[M5CoreS3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_UDB_MODE=1

[esp32c3]
board             = esp32dev
board_build.mcu   = esp32c3
build_flags       =
  -DDUMMY_DISPLAY
  ${coding_standards.build_flags}
[esp32s3]
board             = esp32dev
board_build.mcu   = esp32s3
[esp32p4]
board             = esp32dev
board_build.mcu   = esp32p4

# ESP32シリーズ向け環境定義
[env:esp32-2_0_15]
extends           = esp32, esp32_2_0_15
[env:esp32-2_0_16]
extends           = esp32, esp32_2_0_16
[env:esp32-2_0_17]
extends           = esp32, esp32_2_0_17
[env:esp32-default]
extends           = esp32, esp32_default

[env:m5stack-2_0_15]
extends           = M5Stack, esp32_2_0_15
[env:m5stack-2_0_16]
extends           = M5Stack, esp32_2_0_16
[env:m5stack-2_0_17]
extends           = M5Stack, esp32_2_0_17
[env:m5stack-default]
extends           = M5Stack, esp32_default

[env:m5stickc-2_0_15]
extends           = M5StickC, esp32_2_0_15
[env:m5stickc-2_0_16]
extends           = M5StickC, esp32_2_0_16
[env:m5stickc-2_0_17]
extends           = M5StickC, esp32_2_0_17
[env:m5stickc-default]
extends           = M5StickC, esp32_default

[env:m5core2-2_0_15]
extends           = M5Core2, esp32_2_0_15
[env:m5core2-2_0_16]
extends           = M5Core2, esp32_2_0_16
[env:m5core2-2_0_17]
extends           = M5Core2, esp32_2_0_17
[env:m5core2-default]
extends           = M5Core2, esp32_default

[env:m5cores3-2_0_15]
extends           = M5CoreS3, esp32_2_0_15
[env:m5cores3-2_0_16]
extends           = M5CoreS3, esp32_2_0_16
[env:m5cores3-2_0_17]
extends           = M5CoreS3, esp32_2_0_17
[env:m5cores3-default]
extends           = M5CoreS3, esp32_default

[env:esp32c3-2_0_15]
extends           = esp32c3, esp32_2_0_15
[env:esp32c3-2_0_16]
extends           = esp32c3, esp32_2_0_16
[env:esp32c3-2_0_17]
extends           = esp32c3, esp32_2_0_17
[env:esp32c3-default]
extends           = esp32c3, esp32_default

[env:esp32s3-2_0_15]
extends           = esp32s3, esp32_2_0_15
[env:esp32s3-2_0_16]
extends           = esp32s3, esp32_2_0_16
[env:esp32s3-2_0_17]
extends           = esp32s3, esp32_2_0_17
[env:esp32s3-default]
extends           = esp32s3, esp32_default

[env:esp32p4-default]
extends           = esp32p4, esp32_default
